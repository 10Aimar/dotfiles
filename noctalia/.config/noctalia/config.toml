[bar]
order = [ "MainBar", "SideBar" ]

    [bar.MainBar]
    background_opacity = 0.0
    border = "primary"
    border_width = 0.0
    capsule = true
    capsule_border = "#07081B"
    capsule_fill = "#07081B"
    capsule_opacity = 0.69999998435378075
    center = [ "group:g6", "spacer_mid", "wallpaper", "clock", "workspaces" ]
    concave_edge_corners = false
    end = [ "group:g4", "group:g1", "spacer_right", "tray", "group:g2", "group:g3", "volume", "Lock", "session" ]
    margin_ends = 0
    scale = 1.1000000089406967
    start = [ "launcher", "group:g5" ]

        [bar.MainBar.dead_zone.actions]
        middle = "desktop-widgets-toggle-edit"
        scroll_down = "exec niri msg action focus-column-right-or-first"
        scroll_up = "exec niri msg action focus-column-left-or-last"

        [bar.MainBar.monitor.DP-1]
        enabled = false

        [bar.MainBar.monitor.DP-3]
        enabled = false

        [[bar.MainBar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "#07081B"
        enabled = true
        fill = "#07081B"
        id = "g3"
        members = [ "network", "bluetooth" ]
        opacity = 0.75
        padding = 6.0

        [[bar.MainBar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "#07081B"
        enabled = true
        fill = "#07081B"
        id = "g1"
        members = [ "GPU", "VRAM" ]
        opacity = 0.69999998807907104
        padding = 6.0

        [[bar.MainBar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "#07081B"
        enabled = true
        fill = "#07081B"
        id = "g2"
        members = [ "notifications", "clipboard" ]
        opacity = 0.75
        padding = 6.0

        [[bar.MainBar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "#07081B"
        enabled = true
        fill = "#07081B"
        id = "g4"
        members = [ "RAM", "CPU" ]
        opacity = 0.69999998807907104
        padding = 6.0

        [[bar.MainBar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "#07081B"
        enabled = true
        fill = "#07081B"
        id = "g5"
        members = [ "Musik", "media" ]
        opacity = 0.69999998807907104
        padding = 6.0

        [[bar.MainBar.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "#07081B"
        enabled = true
        fill = "#07081B"
        id = "g6"
        members = [ "mywindow", "active_window" ]
        opacity = 0.69999998807907104
        padding = 6.0

[control_center]
hidden_tabs = [ "monitor" ]
sidebar = "compact"
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "system"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
background_opacity = 0.0
concave_edge_corners = false
enabled = true
icon_size = 65
monitors = [ "HDMI-A-1" ]
pinned = [
    "com.spotify.Client",
    "net.thunderbird.Thunderbird",
    "com.brave.Browser.flextop.brave-eppojlglocelodeimnohnlnionkobfln-Default",
    "com.brave.Browser.flextop.brave-pnghkaloolpocgfpndmjfbhpjffdmdii-Default",
    "org.kde.dolphin",
    "org.mozilla.firefox"
]
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = false

[hot_corners]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[location]
address = "Lisbon"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-widget-0000000000000002",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 240.0
    cx = 960.0
    cy = 953.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = false
        show_keyboard_layout = false
        show_login_button = false
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 224.0
    box_width = 384.0
    cx = 960.0
    cy = 112.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        color = "secondary"
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 144.0
    box_width = 1904.0
    cx = 944.0
    cy = 1004.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        bands = 128
        centered = true
        color_1 = "secondary"
        color_2 = "primary"
        mirrored = true
        reversed = true
        show_when_idle = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 352.0
    box_width = 256.0
    cx = 960.0
    cy = 732.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        hide_when_no_media = true
        layout = "vertical"

[nightlight]
enabled = true
temperature_day = 4500
temperature_night = 3000

[osd]
monitors = [ "HDMI-A-1" ]

[plugins]
enabled = [ "oldirtty/color_picker" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.mpris]
    blacklist = [ "firefox", "brave", "stremio", "vlc" ]

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [shell.shadow]
    direction = "down_right"

[system.monitor]
disk_poll_seconds = 0
gpu_poll_seconds = 5

[theme]
builtin = "Gruvbox"
community_palette = "ADW"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "ghostty", "kcolorscheme", "niri", "starship" ]
    community_ids = [ "spicetify", "pywalfox", "gimp", "inkscape", "vscode", "steam" ]

[wallpaper]
transition = [ "disc", "honeycomb", "stripes" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/dockas/Pictures/1080p/WitcherSigns.jpg"

    [wallpaper.last]
    path = "/home/dockas/Pictures/1080p/WitcherSigns.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/dockas/Pictures/Wallpapers/Illustrated.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/dockas/Pictures/1080p/WitcherSigns.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/dockas/Pictures/1080p/WitcherSigns.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "faithful"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/dockas/Pictures/Wallpapers/Illustrated.png"
    theme_mode = "dark"
    wallpaper_scheme = "dysfunctional"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/dockas/Pictures/Wallpapers/423585.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/dockas/Pictures/Wallpapers/CP2077.png"
    theme_mode = "dark"
    wallpaper_scheme = "vibrant"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/dockas/Pictures/Wallpapers/RedEyedWW3.png"
    theme_mode = "dark"
    wallpaper_scheme = "dysfunctional"

[widget.CPU]
glyph = "cpu-2"
stat = "cpu_temp"
type = "sysmon"
visualization = "none"

[widget.GPU]
glyph = "gpu-usage"
glyph_position = "after"
stat = "gpu_temp"
type = "sysmon"
visualization = "none"

[widget.Lock]
capsule = true
custom_image_colorize = true
glyph = "lock"
icon_color = "secondary"
type = "custom_button"

    [widget.Lock.actions]
    left = "exec noctalia msg session lock"
    right = "exec noctalia msg session lock_and_suspend"

[widget.Musik]
custom_image_colorize = true
glyph = "brand-spotify-filled"
type = "custom_button"

[widget.RAM]
interactive = false
show_glyph = false
stat = "ram_used"
type = "sysmon"
visualization = "none"

[widget.VRAM]
interactive = false
show_glyph = false
stat = "gpu_vram_used"
type = "sysmon"
visualization = "none"

[widget.clock]
anchor = true
font_weight = 1000
scale = 1.3

[widget.cpu]
show_glyph = false
visualization = "none"

[widget.launcher]
capsule = true
capsule_border = "#07081B"
capsule_opacity = 0.75
color = "on_surface"
custom_image = "/home/dockas/Pictures/icons/Scalable/fedoraSamon1.svg"
custom_image_colorize = true
scale = 1.5

[widget.media]
capsule = true
capsule_border = "#07081B"
hide_album_art = true
hide_when_no_media = true
scroll_repeat = "steps"
title_scroll = "on_hover"

    [widget.media.actions]
    scroll_down = "exec ~/.local/bin/spotify-volume.sh down"
    scroll_up = "exec ~/.local/bin/spotify-volume.sh up"

[widget.mywindow]
custom_image_colorize = true
glyph = "align-box-left-stretch"
type = "custom_button"

[widget.network]
show_label = false

[widget.network_rx]
show_glyph = false
stat = "gpu_usage"
visualization = "none"

[widget.network_tx]
show_glyph = false
stat = "gpu_vram_used"
visualization = "none"

[widget.ram]
glyph_position = "after"
show_glyph = false
visualization = "none"

[widget.session]
capsule = true
color = "error"

    [widget.session.actions]
    right = "exec noctalia msg session shutdown"

[widget.spacer_mid]
length = 145
type = "spacer"

[widget.spacer_right]
length = 75
type = "spacer"

[widget.spacer_tv]
length = 80
type = "spacer"

[widget.sysmon]
glyph = "gpu-usage"
stat = "gpu_temp"
visualization = "none"

[widget.temp]
glyph = "cpu-2"
glyph_position = "after"
show_glyph = true
visualization = "none"

[widget.tray]
drawer = true
drawer_item_size = 20.0
pinned = [ "Battle.net", "steam", "spotify", "coolercontrol" ]
scale = 1.2

[widget.volume]
show_label = false

[widget.wallpaper]
scale = 1.3

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
capsule = true
capsule_border = "#07081B"
empty_color = "shadow"
focused_color = "on_hover"
hide_when_empty = true
label_source = "name"
max_label_chars = 3
occupied_color = "on_hover"
